    CreateBeneficiaryRequest:
      type: object
      required:
        - serviceCode
        - collectionMode
        - legalEntityType
        - countryIso3
        - currencyIso
        - providerId
      properties:
        userId:
          type: string
          format: uuid
          description: Unique identifier of the user creating the beneficiary.
        serviceCode:
          type: string
          enum: [MOBILETOPUP, MONEYTRANSFER, BILLPAYMENT]
          description: Type of service to be performed (e.g., MOBILETOPUP, MONEYTRANSFER, BILLPAYMENT).
        collectionMode:
          type: string
          enum: [MOBILEMONEY, BANKACCOUNT, CASH]
          description: Mode of fund collection (e.g., MOBILEMONEY, BANKACCOUNT, CASH).
        legalEntityType:
          type: string
          enum: [I, B]
          description: |
            Legal entity type code:
              - I = Individual
              - B = Business
        countryIso3:
          type: string
          description: ISO 3166-1 alpha-3 code of the beneficiary's country (e.g., USA, IND).
        currencyIso:
          type: string
          description: ISO 4217 currency code (e.g., USD, INR).
        providerId:
          type: string
          description: Identifier of the financial provider or service channel.
        branchId:
          type: string
          nullable: true
          description: Optional branch identifier if applicable.
        beneficiaryNickname:
          type: string
          nullable: true
          description: Optional nickname for the beneficiary for internal reference.
        beneficiaryEmailAddress:
          type: string
          format: email
          nullable: true
          description: Email address of the beneficiary.
        companyName:
          type: string
          nullable: true
          description: Company name if the beneficiary is a business entity.
        firstName:
          type: string
          description: First name of the beneficiary.
        lastName:
          type: string
          description: Last name of the beneficiary.
        dob:
          type: string
          format: date
          description: Date of birth of the beneficiary in YYYY-MM-DD format.
        gender:
          type: string
          enum: [M, F]
          description: Gender of the beneficiary.
        mobileNo:
          type: string
          description: Mobile number of the beneficiary.
        postcode:
          type: string
          description: Postal code of the beneficiary's address.
        city:
          type: string
          description: City of the beneficiary's residence.
        address:
          type: string
          description: Street address of the beneficiary.
        addressLine2:
          type: string
          nullable: true
          description: Additional address information (optional).
        district:
          type: string
          nullable: true
          description: District or locality (optional).
        stateOrProvince:
          type: string
          nullable: true
          description: State or province of residence (optional).
        nationalityCountry:
          type: string
          description: Country of nationality.
        birthCountry:
          type: string
          description: Country of birth.
        reasonId:
          type: string
          nullable: true
          description: Reason for creating the beneficiary (optional).
        relationId:
          type: string
          nullable: true
          description: Relation to the beneficiary (optional).
        sourceOfFundId:
          type: string
          nullable: true
          description: Source of funds for the transaction (optional).
        narration:
          type: string
          nullable: true
          description: Optional description or message associated with the transaction.
        bankAccountEmail:
          type: string
          format: email
          nullable: true
          description: Email address linked to the bank account (optional).
        branchCode:
          type: string
          nullable: true
          description: Bank branch code (optional).
        ifsc:
          type: string
          nullable: true
          description: Indian Financial System Code (optional).
        aba:
          type: string
          nullable: true
          description: ABA routing number (optional, used in US).
        bankAddress:
          type: string
          nullable: true
          description: Address of the beneficiary's bank (optional).
        institutionNo:
          type: string
          nullable: true
          description: Institution number (used in Canada, optional).
        bankName:
          type: string
          nullable: true
          description: Name of the beneficiary's bank (optional).
        clabe:
          type: string
          nullable: true
          description: CLABE code used in Mexico (optional).
        bicSwift:
          type: string
          nullable: true
          description: SWIFT/BIC code for international bank transfers (optional).
        acctNumber:
          type: string
          nullable: true
          description: Bank account number (optional).
        sortCode:
          type: string
          nullable: true
          description: UK sort code for banks (optional).
        iban:
          type: string
          nullable: true
          description: International Bank Account Number (optional).
        bsbCode:
          type: string
          nullable: true
          description: Bank State Branch code used in Australia (optional).
        cnaps:
          type: string
          nullable: true
          description: CNAPS code used in China (optional).
        identificationNumber:
          type: string
          nullable: true
          description: Identification document number (optional).
        idIssuingCountry:
          type: string
          nullable: true
          description: Country that issued the identification document (optional).
        idIssueDate:
          type: string
          format: date
          nullable: true
          description: Date when the identification document was issued (optional).
        identificationType:
          type: string
          nullable: true
          description: Type of identification document (e.g., passport, ID card, etc.).
        idExpiryDate:
          type: string
          format: date
          nullable: true
          description: Expiration date of the identification document (optional).
        billReferenceNumber:
          type: string
          nullable: true
